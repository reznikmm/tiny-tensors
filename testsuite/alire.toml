name = "testsuite"
description = "Tests for tiny-tensors"
version = "0.1.0-dev"

authors = ["Max Reznik"]
maintainers = ["Max Reznik <reznikmm@gmail.com>"]
maintainers-logins = ["reznikmm"]
licenses = "Apache-2.0 WITH LLVM-exception"
website = ""
tags = []

executables = ["testsuite-driver"]

[build-switches]
development.Ada_Version = "Ada2022"
development.optimization = ["-O0"]
development.contracts = "Yes"
development.style_checks = ["-gnaty", "-gnaty-B"]
"*".debug_info = "Yes"

[build-profiles]
"*" = "development"

[[depends-on]]
slim_test = "*"
tiny_tensors = "*"

[[pins]]
tiny_tensors = { path='..' }
slim_test = { url = "https://github.com/reznikmm/slim_test.git", commit = "6df0f6635def7ea04acb75a359fbde7da5206331" }
