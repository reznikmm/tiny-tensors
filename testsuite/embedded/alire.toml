name = "embedded"
description = "Embedded testtuite"
version = "0.1.0-dev"

authors = ["Max Reznik"]
maintainers = ["Max Reznik <reznikmm@gmail.com>"]
maintainers-logins = ["reznikmm"]
licenses = "Apache-2.0 WITH LLVM-exception"
website = ""
tags = []

executables = ["embedded"]

[build-switches]
"*".Ada_Version = "Ada2022"
development.optimization = ["-O1"]
development.style_checks = ["-gnaty", "-gnaty-B"]
development.contracts = "Yes"
"*".debug_info = "Yes"

[environment]
SLIM_TEST_FIX.prepend = "${CRATE_ROOT}/src/fix"

[build-profiles]
"tiny_tensors" = "release"

[[actions]]
type = "post-build"
command = ["arm-eabi-objcopy", "-Obinary", "embedded", "embedded.bin"]
directory = "bin"

[[depends-on]]
gnat_arm_elf = "*"
slim_test = "*"
tiny_tensors = "*"

[[pins]]
tiny_tensors = { path = "../.." }
slim_test = { url = "https://github.com/reznikmm/slim_test.git", commit = "6df0f6635def7ea04acb75a359fbde7da5206331" }
